# The `edge` storage leg: SQL Server 2022, BESIDE the default SQL Server 2025 rather than instead of
# it. Standalone — not an override of docker-compose.yml — with its own compose project, container
# name and host port, so both servers can be up on one box at once:
#
#   docker compose -f docker-compose.edge.yml up -d
#   ./build.sh LocalGate --storage edge          # or CIPolecat / CIAspNetCore / CIEfCore --storage edge
#
# `--storage edge` points the Nuke targets at localhost,11435 (--edge-connection-string). The test
# workflows' `edge` matrix axis starts this file the same way.
#
# History: the axis used to pull `mcr.microsoft.com/azure-sql-edge`, which Microsoft retired (pulls
# now return "pull access denied"), and was then an override file that swapped the default service's
# image for `mssql/server:2022-latest`. That override kept the default container's name and port, so
# only one of the two servers fit on a box. The axis is still called `edge` so the status checks of
# the three test workflows, and any branch protection naming them, keep their names. 2022 carries
# neither the native `json` type nor `vector`; ConnectionSource.SupportsNativeJson / SupportsVector
# detect that.
#
# Port 11435, not 11434: 11434 is Ollama's default.
name: polecat-edge

services:
  sqlserver-edge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: polecat-sqlserver-edge
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@55w0rd"
      MSSQL_PID: "Developer"
      SQLCMD_PATH: "/opt/mssql-tools18/bin/sqlcmd"
    ports:
      - "11435:1433"
    healthcheck:
      test: ["CMD-SHELL", "$$SQLCMD_PATH -S localhost -U sa -P $$SA_PASSWORD -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
