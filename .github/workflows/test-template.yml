name: test-template

on:
  workflow_call:
    inputs:
      # The Nuke target that runs the suite through Bobcat's supervisor: CIPolecat, CIAspNetCore or
      # CIEfCore (build/SupervisedTests.cs). What CI does lives in build/, not here — this workflow
      # only supplies the SQL Server the target runs against.
      NUKE_TARGET:
        required: true
        type: string
      STORAGE_TYPE:
        required: false
        type: string
        default: "default"
      # Worker processes. 0 leaves the target's committed count in charge, which the runner clamps
      # to ProcessorCount / 2 (2 on a 4-vCPU hosted runner). A positive number is passed as
      # --test-workers, which overrides the committed count AND the clamp — so a caller that sets it
      # is making a measured claim about what the runner can carry, and should say what it is.
      TEST_WORKERS:
        required: false
        type: number
        default: 0
      # Split one storage leg across several runners: this job owns shard SHARD (1-based) of
      # SHARD_COUNT, by a stable hash of the test class (build/SupervisedTests.cs, --test-shard). 1 of 1
      # is the whole suite and leaves every name below exactly as it was.
      SHARD:
        required: false
        type: number
        default: 1
      SHARD_COUNT:
        required: false
        type: number
        default: 1

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Per-job artifact name: sibling shards of one run must not collide on upload.
      LEDGER_ARTIFACT: test-ledger-${{ inputs.NUKE_TARGET }}-${{ inputs.STORAGE_TYPE }}${{ inputs.SHARD_COUNT > 1 && format('-shard{0}of{1}', inputs.SHARD, inputs.SHARD_COUNT) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 10.0.x builds and runs the Nuke project and the net10.0 test hosts (bin/Release/net10.0).
      # net11.0 is built locally against the 11.0 SDK preview until it ships.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # `edge` is SQL Server 2022 from the standalone docker-compose.edge.yml (container
      # polecat-sqlserver-edge, port 11435); `--storage edge` below points the target at it.
      - name: Start SQL Server
        run: |
          if [ "${{ inputs.STORAGE_TYPE }}" = 'edge' ]; then
            docker compose -f docker-compose.edge.yml up -d
            echo "SQLSERVER_CONTAINER=polecat-sqlserver-edge" >> "$GITHUB_ENV"
          else
            docker compose up -d
            echo "SQLSERVER_CONTAINER=polecat-sqlserver" >> "$GITHUB_ENV"
          fi

      - name: Wait for SQL Server to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$SQLSERVER_CONTAINER")
            if [ "$STATUS" == "healthy" ]; then
              echo "SQL Server is ready!"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i)"
            sleep 5
          done
          echo "SQL Server failed to become healthy"
          exit 1

      # The last green main run's ledgers for this target and server, so lanes are balanced by recent
      # measured durations. The pattern takes every shard's ledger (and an unsharded one), because a
      # shard's classes are only a slice and the files all carry the same name; the build merges
      # whatever it finds, deduplicated by run id. The ledger is a CI artifact only (nothing is committed): each run folds
      # its own results into the one it fetched and uploads it again below. Best-effort by design: a
      # pruned artifact or a download hiccup costs one run's balancing, which falls back to test
      # counts, and nothing else.
      - name: Fetch previous test ledger
        continue-on-error: true
        run: |
          gh run download --repo "$GITHUB_REPOSITORY" \
            --pattern "test-ledger-${{ inputs.NUKE_TARGET }}-${{ inputs.STORAGE_TYPE }}*" \
            --dir previous-ledger \
            $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}.yml" --branch main \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        env:
          GH_TOKEN: ${{ github.token }}

      # Builds the test project and drives its Microsoft.Testing.Platform host across worker
      # processes: lanes partitioned by test class, a catalog per lane, stall reporting, opt-in
      # retries, the run report into the job summary, and a TRX where the reporter below looks.
      - name: Test (supervised)
        run: |
          WORKERS=""
          if [ "${{ inputs.TEST_WORKERS }}" != "0" ]; then WORKERS="--test-workers ${{ inputs.TEST_WORKERS }}"; fi
          SHARD=""
          if [ "${{ inputs.SHARD_COUNT }}" != "1" ]; then SHARD="--test-shard ${{ inputs.SHARD }} --test-shard-count ${{ inputs.SHARD_COUNT }}"; fi
          ./build.sh ${{ inputs.NUKE_TARGET }} --framework net10.0 --storage ${{ inputs.STORAGE_TYPE }} $WORKERS $SHARD

      # Every run's ledger, red or green, PR or main — the fetched history plus this run. Only a green
      # main run's is ever read back, by the next run of this workflow.
      - name: Publish test ledger
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LEDGER_ARTIFACT }}
          path: |
            artifacts/test-ledger/
            artifacts/test-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Report results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: xUnit Tests (${{ inputs.STORAGE_TYPE }}${{ inputs.SHARD_COUNT > 1 && format(' {0}/{1}', inputs.SHARD, inputs.SHARD_COUNT) || '' }})
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx
          list-suites: "failed"
          list-tests: "failed"

      - name: Stop containers
        if: ${{ always() }}
        run: |
          docker compose down
          docker compose -f docker-compose.edge.yml down
