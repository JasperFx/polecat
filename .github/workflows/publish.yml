name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.2.0). Leave blank to use version from csproj.'
        required: false

# Trusted publishing (OIDC), rather than a long-lived NUGET_API_KEY secret, the same as JasperFx,
# Weasel, Marten, Fisher and Wolverine. NuGet/login exchanges this run's GitHub OIDC token for an API
# key that expires within the hour, so there is no durable credential to leak or rotate. `id-token:
# write` lets the runner request that token. The policy on nuget.org names this repository and this
# workflow's file name, so renaming this file breaks publishing until the policy is updated.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore polecat.slnx

      - name: Build
        run: dotnet build polecat.slnx -c Release --no-restore

      - name: Pack
        run: |
          VERSION_ARG=""
          if [[ -n "${{ steps.version.outputs.version }}" ]]; then
            VERSION_ARG="-p:Version=${{ steps.version.outputs.version }}"
          fi
          dotnet pack src/Polecat/Polecat.csproj -c Release --no-build -o ./artifacts $VERSION_ARG
          dotnet pack src/Polecat.AspNetCore/Polecat.AspNetCore.csproj -c Release --no-build -o ./artifacts $VERSION_ARG
          dotnet pack src/Polecat.EntityFrameworkCore/Polecat.EntityFrameworkCore.csproj -c Release --no-build -o ./artifacts $VERSION_ARG

      # Right before the push, because the key it returns only lasts an hour
      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: jeremydmiller

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
