name: efcore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test-template.yml
    strategy:
      fail-fast: false
      matrix:
        storage_type: [default, edge]
    with:
      NUKE_TARGET: CIEfCore
      STORAGE_TYPE: ${{ matrix.storage_type }}