name: aot-runtime-smoke

# AOT RUNTIME gate (#725), the companion to `aot-smoke`. The division of labour is the point:
#
#   aot-smoke          BUILDS Polecat.AotSmoke and never runs it. A static gate on annotations.
#   aot-runtime-smoke  PUBLISHES NATIVE and RUNS, against a real SQL Server.
#
# The first cannot replace the second, and not merely because it lacks a database: Polecat's public
# LINQ async surface (PolecatQueryableExtensions) carries class-level
# [UnconditionalSuppressMessage] for IL2026/IL2060/IL3050, so the analyzer is SILENT on exactly the
# path Marten's four Native AOT bugs were on. Adding a read to the build-only lane therefore gates
# nothing new at runtime — "writes were fine, the first read threw" (marten#5328) is what a
# build-only lane reports as green.
#
# ⚠️ THIS LANE BLOCKS. continue-on-error came off in #752, and the mechanism that let it is worth
# knowing before adding a shape.
#
# On its first run the lane found that Polecat did not function AT ALL under Native AOT (#733), so it
# was created continue-on-error with a note to flip that off "when #733 lands". #733 landed — 16 of
# 18 shapes now pass — but two documented limitations remain, and a lane that returns non-zero on ANY
# failure could never go green over them. Permanently red plus continue-on-error means a regression in
# the sixteen WORKING shapes changes nothing anyone can see. A gate that cannot go green does not gate.
#
# So each shape in Program.cs DECLARES its expected outcome and the binary is red whenever reality
# disagrees in either direction: an expected pass that fails, an expected FAILURE that passes (the gap
# closed and the docs are now stale), or an expected failure whose message no longer contains the
# documented reason (a database that is down is not evidence about AOT). The two expected failures are
# a GroupBy projected into an anonymous type (#743), which cannot work, and a strong-typed document id
# deliberately left UNregistered (#751) -- the control proving opts.RegisterValueTypeId is what makes the
# registered one pass. Both are documented in docs/configuration/native-aot.md, and the log still prints
# each in full.
#
# ⚠️ An expected failure is therefore NOT a skip, and the right response to one going red is to read
# it rather than to adjust its expectation.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Start SQL Server
        run: docker compose up -d

      - name: Wait for SQL Server to be healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' polecat-sqlserver)
            if [ "$STATUS" == "healthy" ]; then
              echo "SQL Server is ready!"
              exit 0
            fi
            echo "Waiting for SQL Server... ($i)"
            sleep 5
          done
          echo "SQL Server failed to become healthy"
          exit 1

      # The AotRuntimeSmoke Nuke target (build/LocalGate.cs) — the same one `./build.sh LocalGate --aot`
      # runs locally, where it publishes for the host's RID instead. Native publish for linux-x64, then
      # the binary runs against SQL Server in a catalog of its own (polecat_aot). Trim and AOT warnings
      # are NOT promoted to errors, deliberately: this lane's question is what HAPPENS, and failing the
      # publish on a warning would stop it ever being asked. aot-smoke is the lane that asserts what is
      # annotated.
      #
      # The binary prints one line per execution shape — `ok`, `xfail` or `FAIL` — each naming the
      # issue it mirrors or is excluded by, and returns non-zero listing every shape that did not
      # match its declared expectation. So the log says WHICH shape broke rather than only that
      # something did, and it runs every shape rather than stopping at the first failure.
      - name: Publish native (linux-x64) and run against SQL Server
        run: ./build.sh AotRuntimeSmoke --aot-runtime linux-x64

      - name: Stop SQL Server
        if: always()
        run: docker compose down
