name: aspnetcore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test-template.yml
    strategy:
      fail-fast: false
      matrix:
        storage_type: [default, edge]
        # Newest framework on the newest SQL Server, oldest on the oldest (test-template.yml).
        include:
          - storage_type: default
            framework: net11.0
          - storage_type: edge
            framework: net10.0
    with:
      NUKE_TARGET: CIAspNetCore
      STORAGE_TYPE: ${{ matrix.storage_type }}
      FRAMEWORK: ${{ matrix.framework }}
